# Nginx reverse proxy for LeadGuru Teach on redlake.in
# Install path (on VPS): /etc/nginx/sites-available/redlake.in
# Then: sudo ln -s /etc/nginx/sites-available/redlake.in /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name redlake.in www.redlake.in;

    # After Certbot, this block is usually redirected to HTTPS.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    client_max_body_size 20M;
}

